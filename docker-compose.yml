services:
  # TaskFlow Production Database
  taskflow-production-db:
    image: postgres:15
    container_name: taskflow-production-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_prod_pass}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow_production}
    ports:
      - "5432:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    networks:
      - data-stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock Stripe API
  mock-stripe-api:
    build:
      context: ./mock-apis
      dockerfile: Dockerfile
    container_name: mock-stripe-api
    ports:
      - "5001:5001"
    networks:
      - data-stack
    depends_on:
      taskflow-production-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=taskflow-production-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=taskflow_production
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=taskflow_prod_pass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # Data Sync Service (Google Sheets + Stripe)
  data-sync-service:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: data-sync-service
    volumes:
      # Mount Google credentials (user provides this file)
      - ./google-credentials.json:/app/google-credentials.json:ro
      # Mount sync logs to host for easy viewing
      - ./logs:/var/log/sync
    networks:
      - data-stack
    depends_on:
      taskflow-production-db:
        condition: service_healthy
      mock-stripe-api:
        condition: service_started
    environment:
      - POSTGRES_HOST=taskflow-production-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=taskflow_production
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=taskflow_prod_pass
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
    # Default: run in cron mode (scheduled syncs every 6 hours)
    command: ["cron-mode"]

  # dbt Service (for running transformations)
  dbt-service:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    container_name: dbt-service
    working_dir: /usr/app/dbt
    volumes:
      - ./dbt:/usr/app/dbt
    networks:
      - data-stack
    depends_on:
      - taskflow-production-db
    environment:
      - DBT_PROFILES_DIR=/usr/app/dbt
    # Keep container running - use sh not dbt
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]

  # Metabase Database
  metabase-db:
    image: postgres:15
    container_name: metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASS:-metabase_pass}
      POSTGRES_DB: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    networks:
      - data-stack

  # Metabase Application
  taskflow-metabase:
    image: metabase/metabase:v0.57.6
    container_name: taskflow-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASS:-metabase_pass}
      MB_DB_HOST: metabase-db
    ports:
      - "3000:3000"
    depends_on:
      - metabase-db
    networks:
      - data-stack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  data-stack:
    driver: bridge

volumes:
  taskflow-db-data:
  metabase-db-data:
