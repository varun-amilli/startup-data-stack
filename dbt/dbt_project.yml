name: 'taskflow_analytics'
version: '1.0.0'
config-version: 2

profile: 'taskflow_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  taskflow_analytics:
    staging:
      +materialized: view
      +schema: analytics
    marts:
      +materialized: table
      +schema: analytics

tests:
  taskflow_analytics:
    +store_failures: true
    +schema: test_results
