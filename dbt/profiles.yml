taskflow_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'taskflow-production-db') }}"
      user: "{{ env_var('POSTGRES_USER', 'taskflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'taskflow_prod_pass') }}"
      port: 5432
      dbname: taskflow_production
      schema: analytics
      threads: 4
      keepalives_idle: 0
