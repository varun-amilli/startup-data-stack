sources:
  - name: taskflow
    description: TaskFlow application database (user data, product events)
    database: taskflow_production
    schema: public
    tables:
      - name: users
        description: User accounts and profiles
      - name: events
        description: Product usage events
  
  - name: stripe
    description: Stripe payment data (synced from Stripe API)
    database: taskflow_production
    schema: stripe
    tables:
      - name: customers
        description: Stripe customer records
      - name: subscriptions
        description: Stripe subscription records (source of truth for revenue)
      - name: charges
        description: Stripe charge/payment records
      - name: invoices
        description: Stripe invoice records
